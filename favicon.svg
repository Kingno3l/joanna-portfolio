  <path d="M22 17 Q27 21 31 27" stroke="#8ae0be" stroke-width="1" stroke-linecap="round" opacity="0.75" fill="none"/>
  <path d="M42 13 Q38 17 34 23" stroke="#b4f1d7" stroke-width="1" stroke-linecap="round" opacity="0.75" fill="none"/>
